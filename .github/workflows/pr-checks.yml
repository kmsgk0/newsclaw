name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate specifications
        run: npm run check:specs
      - name: Check repository files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:repo -- --base "$BASE_SHA"
      - name: Check commit references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:commits -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Test repository checks
        run: npm run test:checks

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          release='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1'
          archive='gitleaks_8.30.1_linux_x64.tar.gz'
          curl --fail --location --silent --show-error "$release/$archive" -o "$archive"
          curl --fail --location --silent --show-error "$release/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          awk -v file="$archive" '$2 == file { print }' checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf "$archive" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Scan secrets and audit dependencies
        run: npm run check:security
      - name: Test security checks
        run: npm run test:security
