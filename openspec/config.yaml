schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  NewsClaw is a personalized AI news reading platform.
  Stack: React Router, TypeScript, Tailwind CSS, Node.js, Fastify, PostgreSQL, Docker Compose.
  Read AGENTS.md, CONTRIBUTING.md and the applicable docs/standards files before editing artifacts.
  docs/README.md is the documentation entry; docs/architecture.md explains current architecture, and openspec/specs holds current behavior contracts. Active changes carry undelivered scope and implementation tasks.
  Select one deliverable scope for each change, preserve requirement identifiers, and include its tests and documentation. Keep source, test, script and document responsibilities explicit in design.
  On completion, sync current specs and archive that change; keep remaining confirmed goals in their corresponding changes.
  For model, prompt or skill behavior read docs/standards/ai.md and docs/verification/ai-cases.md; for data changes read docs/standards/data.md.
  Use docs/standards/review.md for applicable checks and report actual results.
  All repository changes, including tools, configuration and documentation, use OpenSpec before implementation.
  Before implementation, ensure the proposal, design, scenarios and tasks cover the intended changes.
  Write artifacts as standalone project documents for developers, with concrete scope, behavior and verification criteria.
  Discuss unclear requirements or important design changes and update the specs; handle ordinary implementation details directly.
  Check requirement coverage and the actual diff, report verification honestly, and archive after implementation tasks and required checks are complete.
  Commits describe the change and identify the corresponding OpenSpec change and requirements or tasks.
  Use one shared news library, one editor per user, and account ownership for private content.
rules:
  proposal:
    - State the problem, scope and affected areas; reuse existing requirements where they cover the change.
  design:
    - Explain the approach and relevant trade-offs at a depth proportional to the change.
  specs:
    - Give each requirement a stable identifier and observable GIVEN/WHEN/THEN scenarios.
    - Cover applicable input, permission, missing-resource and dependency failures.
  tasks:
    - Track implementation and verification work; associate each task with requirement identifiers and a verification method.
    - Keep unimplemented and unverified tasks unchecked.
    - For documentation changes, verify content, links and consistency without adding unrelated runtime tests.
