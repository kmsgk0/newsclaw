name: newsclaw
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: newsclaw
      POSTGRES_DB: newsclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsclaw -d newsclaw"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    image: newsclaw:${APP_VERSION:-local}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://newsclaw:${POSTGRES_PASSWORD}@db:5432/newsclaw
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 3100
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
      APP_VERSION: ${APP_VERSION:-local}
    command: ["sh", "-c", "node dist/server/migrate.js && node dist/server/seed.js && node dist/server/index.js"]
    ports: ["127.0.0.1:${HOST_PORT:-3100}:3100"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    image: newsclaw:${APP_VERSION:-local}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://newsclaw:${POSTGRES_PASSWORD}@db:5432/newsclaw
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      APP_VERSION: ${APP_VERSION:-local}
    command: ["sh", "-c", "node dist/server/migrate.js && node dist/server/worker.js"]
    depends_on:
      api: {condition: service_started}
    init: true
    stop_grace_period: 30s
  backup:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: db
      PGUSER: newsclaw
      PGDATABASE: newsclaw
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/operations/backup.sh:/scripts/backup.sh:ro
      - ./scripts/operations/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./scripts/operations/restore.sh:/scripts/restore.sh:ro
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    depends_on:
      api: {condition: service_healthy}
    init: true
volumes:
  postgres-data:
  redis-data:
