services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: newsclaw_test
      POSTGRES_DB: newsclaw_test
      POSTGRES_PASSWORD: isolated-acceptance-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsclaw_test -d newsclaw_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["test-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  acceptance:
    image: ${ACCEPTANCE_IMAGE:?Run scripts/acceptance.sh}
    init: true
    shm_size: 1gb
    stop_grace_period: 20s
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://newsclaw_test:isolated-acceptance-database@db:5432/newsclaw_test
      REDIS_URL: redis://redis:6379
      CHAT_BASE_URL: http://127.0.0.1:4999/v1
      CHAT_API_KEY: synthetic-fixture
      CHAT_MODEL: fixture
      EMBEDDING_BASE_URL: http://127.0.0.1:4999/v1
      EMBEDDING_API_KEY: synthetic-fixture
      EMBEDDING_MODEL: fixture
      VERIFICATION_DIR: /reports
      SOURCE_GIT_DIRECTORY: ${SOURCE_GIT_DIRECTORY:?Run scripts/acceptance.sh}
      ACCEPTANCE_BASE: ${ACCEPTANCE_BASE:-main}
      ACCEPTANCE_HEAD: ${ACCEPTANCE_HEAD:-HEAD}
    volumes:
      - ${ACCEPTANCE_SOURCE:?Run scripts/acceptance.sh}:/source:ro
      - ${ACCEPTANCE_GIT_COMMON:?Run scripts/acceptance.sh}:/git-source:ro
      - ${ACCEPTANCE_REPORT_DIR:?Run scripts/acceptance.sh}:/reports
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  test-postgres:
